name: janus-bci
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.10

  # PyTorch CPU — se instala en el Dockerfile vía pip --index-url cpu
  # para garantizar la versión exacta sin CUDA

  # Librerías científicas — mismas versiones que gpu para consistencia
  - scipy=1.17.0
  - mne=1.11.0
  - pandas=2.3.3
  - scikit-learn=1.6.1
  - numpy
  - matplotlib
  - seaborn

  # Librerías de sistema
  - libstdcxx-ng=12

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  # Herramientas de JANUS
  - python-dotenv=1.0.1

  - pip
  - pip:
      - setuptools==75.6.0
      - mlflow==2.13.0
      - sqlalchemy==2.0.30
      - pydantic==2.7.4
      - pydantic-settings==2.3.4
      - mne-icalabel==0.8.1
      - pyriemann==0.7